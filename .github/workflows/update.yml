name: Update tennis data

on:
  schedule:
    - cron: '0 5 * * 4'  # Every Thursday 05:00 UTC
  workflow_dispatch:
    inputs:
      no_results:
        description: 'Skip re-downloading results'
        type: boolean
        default: false
      refresh_schedule:
        description: 'Re-download and re-parse the fixture schedule'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -e .

      - name: Run update
        run: |
          ARGS=""
          [ "${{ github.event.inputs.no_results }}" = "true" ] && ARGS="$ARGS --no-results"
          [ "${{ github.event.inputs.refresh_schedule }}" = "true" ] && ARGS="$ARGS --refresh-schedule"
          python scripts/update.py $ARGS

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tables/
          git diff --cached --quiet || (git commit -m "chore: update results $(date +'%Y-%m-%d')" && git push)
