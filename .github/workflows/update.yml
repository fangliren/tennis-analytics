name: Update tennis data

on:
  schedule:
    - cron: '0 5 * * 4'  # Every Thursday 05:00 UTC
  workflow_dispatch:       # Also triggerable manually from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -e .

      - name: Run update
        run: python scripts/update.py

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tables/
          git diff --cached --quiet || (git commit -m "chore: update results $(date +'%Y-%m-%d')" && git push)
